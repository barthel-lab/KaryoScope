name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede earlier runs of the same PR, but never one merge's run with the
# next merge's. Keying on github.ref put every push to main in one group, so
# merging PRs back to back cancelled the earlier merge commit's run and left
# it with no CI at all. Keying on the PR number when there is one, and the
# commit sha otherwise, gives each main commit a group of its own: merges
# neither cancel nor queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install KaryoScope
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke test the CLI
        run: |
          karyoscope --version
          karyoscope --help

      - name: Run pytest (unit tests — integration deselected by default)
        run: pytest --cov=karyoscope --cov-report=term-missing

  # ----------------------------------------------------------------------
  # Build the C++ get_featureIDs binary and run integration tests against
  # it. Kept as a separate job from the unit test matrix so:
  #   1) A failing C++ build doesn't cascade into 8 redundant unit-test
  #      failures.
  #   2) We only need to build once per OS — Python version doesn't
  #      affect the C++ build, so we test against a single Python.
  #   3) The unit test matrix runs even when the build environment can't
  #      satisfy the C++ deps, which keeps Python-only contributors
  #      unblocked.
  # ----------------------------------------------------------------------
  cpp_build_and_integration:
    name: C++ build + integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install C++ build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # macOS Xcode CLT ships zlib; Apple Clang supports C++20 (std::span etc.)
      # in Xcode 15+. macos-latest currently provides Xcode 15+, so no extra
      # install is needed.

      - name: Show toolchain
        run: |
          echo "OS:       $(uname -a)"
          echo "make:     $(make --version | head -1)"
          echo "c++:      $(c++ --version | head -1)"

      - name: Build get_featureIDs
        run: make -C native/get_featureIDs

      - name: Show built binary
        run: |
          ls -la native/get_featureIDs/build/
          ./native/get_featureIDs/build/get_featureIDs --help

      - name: Install KaryoScope (for integration tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest -m integration -v
